name: Full Eval (Deployment Check)

on:
  workflow_dispatch:
    inputs:
      compose_url:
        description: "Deployed compose endpoint URL"
        required: true
        type: string
      model:
        description: "Claude model for parse/refine steps"
        required: false
        default: "claude-haiku-4-5-20251001"
        type: string

jobs:
  eval-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run full eval
        run: |
          python scripts/run_full_eval.py \
            "${{ inputs.compose_url }}" \
            --model "${{ inputs.model }}"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/eval_results.json
            eval/*.wav
          retention-days: 30
