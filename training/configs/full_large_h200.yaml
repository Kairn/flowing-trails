# Full training config — musicgen-melody-large on H200 (141GB VRAM).
# Unlocks: batch 4, segment_duration 40, EMA.
# Run via: make train-full-h200
#
# 1120 tracks, 46.9 hrs, ~5x exposure per segment over 10 epochs.

solver: musicgen/musicgen_melody_32khz
model/lm/model_scale: large
conditioner: chroma2music
dset: vgm

continue_from: "//pretrained/facebook/musicgen-melody-large"
channels: 1
"+dataset.info_fields_required": false
autocast: true
autocast_dtype: bfloat16

transformer_lm:
  checkpointing: torch

dataset:
  batch_size: 4
  segment_duration: 40
  valid:
    num_samples: 100
  generate:
    num_samples: 4

optim:
  epochs: 10
  updates_per_epoch: 528
  lr: 5e-5
  ema:
    use: true
  adam:
    weight_decay: 0.01

schedule:
  cosine:
    warmup: 300

checkpoint:
  save_last: true
  save_every: 1
  keep_last: 10

generate:
  every: 2
