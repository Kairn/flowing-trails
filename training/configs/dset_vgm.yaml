  max_sample_rate: 32000
  max_channels: 1
  train: /dora/data/data.jsonl.gz
  valid: /dora/data/data.jsonl.gz
  evaluate: /dora/data/data.jsonl.gz
  generate: /dora/data/data.jsonl.gz
