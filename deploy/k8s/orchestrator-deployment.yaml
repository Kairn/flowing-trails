# Orchestrator: CPU-only, CLAP model ~1.5GB resident for scoring
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app: flowing-trails
    component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      component: orchestrator
  template:
    metadata:
      labels:
        app: flowing-trails
        component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/flowing-trails/orchestrator:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowing-trails-secrets
                  key: anthropic_api_key
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: flowing-trails-config
                  key: qdrant_url
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowing-trails-secrets
                  key: qdrant_api_key
            - name: MUSICGEN_SERVICE_URL
              value: http://musicgen:8000
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: flowing-trails-config
                  key: otlp_endpoint
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: flowing-trails-secrets
                  key: otlp_headers
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels:
    app: flowing-trails
    component: orchestrator
spec:
  selector:
    component: orchestrator
  ports:
    - port: 8080
      targetPort: 8080
