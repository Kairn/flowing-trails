apiVersion: v1
kind: ConfigMap
metadata:
  name: flowing-trails-config
  labels:
    app: flowing-trails
data:
  musicgen_model_tag: "melody-large"
  qdrant_url: "https://YOUR_CLUSTER.qdrant.io:6333"
  otlp_endpoint: "https://otlp-gateway-prod-YOUR-REGION.grafana.net/otlp"
---
apiVersion: v1
kind: Secret
metadata:
  name: flowing-trails-secrets
  labels:
    app: flowing-trails
type: Opaque
stringData:
  anthropic_api_key: "REPLACE"
  qdrant_api_key: "REPLACE"
  otlp_headers: "Authorization=Basic REPLACE"
